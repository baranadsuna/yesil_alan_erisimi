<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="40%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="roadGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accentPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#011b15" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base with Deep Forest & Emerald Gradient -->
  <rect x="14" y="14" width="228" height="228" rx="54" ry="54" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="15" y="15" width="226" height="226" rx="53" ry="53" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Pedshed Isochrone Ripple Waves (Concentric Buffer Bands) -->
  <circle cx="128" cy="116" r="92" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.25"/>
  <circle cx="128" cy="116" r="70" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.35"/>
  <circle cx="128" cy="116" r="48" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" stroke-opacity="0.5"/>

  <!-- Street Network Graph Paths -->
  <path d="M 32 192 L 86 192 L 128 156 L 170 192 L 224 192" fill="none" stroke="url(#roadGrad1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 128 226 L 128 156 L 76 104 L 38 104" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <path d="M 128 156 L 180 104 L 218 104" fill="none" stroke="#fb923c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Network Junction Nodes -->
  <circle cx="86" cy="192" r="6.5" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <circle cx="170" cy="192" r="6.5" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <circle cx="76" cy="104" r="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="180" cy="104" r="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="128" cy="226" r="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>

  <!-- Central Hub Node -->
  <circle cx="128" cy="156" r="9.5" fill="url(#accentPin)" stroke="#064e3b" stroke-width="2.5"/>
  <circle cx="128" cy="156" r="4" fill="#ffffff"/>

  <!-- Aesthetic Green Space Canopy (Organic Park Geometry) -->
  <path d="M 128 36 C 102 36 84 56 84 80 C 68 83 56 97 56 114 C 56 132 71 146 89 146 C 94 146 99 145 103 143 C 110 150 119 154 128 154 C 137 154 146 150 153 143 C 157 145 162 146 167 146 C 185 146 200 132 200 114 C 200 97 188 83 172 80 C 172 56 154 36 128 36 Z"
        fill="url(#canopyGrad)"/>
  
  <!-- Subtle High-Gloss Foliage Highlight -->
  <path d="M 128 48 C 110 48 98 62 98 78 C 86 81 78 90 78 102 C 78 116 88 124 102 124 C 110 124 116 120 120 114 C 122 112 125 111 128 111 C 131 111 134 112 136 114 C 140 120 146 124 154 124 C 168 124 178 116 178 102 C 178 90 170 81 158 78 C 158 62 146 48 128 48 Z"
        fill="#ffffff" fill-opacity="0.32"/>

  <!-- Modern Stylized Tree Stem -->
  <path d="M 124 146 L 132 146 L 130 160 L 126 160 Z" fill="#022c22"/>
  
  <!-- Pedestrian Walking Figure Silhouette on Road Network -->
  <circle cx="86" cy="176" r="3.5" fill="#facc15"/>
  <path d="M 86 181 L 86 187 M 83 184 L 89 184 M 84 191 L 86 187 L 88 191" stroke="#facc15" stroke-width="1.8" stroke-linecap="round"/>
</svg>
