      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="isoGlow" cx="50%" cy="48%" r="44%">
