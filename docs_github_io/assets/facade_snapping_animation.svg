<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#0b1720"/>
    </linearGradient>
    <filter id="neonGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ui { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, monospace; }
      .green-wave {
        stroke: #22c55e; stroke-width: 5; stroke-linecap: round; fill: none;
        filter: url(#neonGreen);
        stroke-dasharray: 220; stroke-dashoffset: 220;
        animation: flowG 4.5s infinite ease-out;
      }
      .facade-pulse {
        fill: #16a34a; stroke: #4ade80; stroke-width: 2.2;
        animation: fillGreen 4.5s infinite ease-in-out;
      }
      @keyframes flowG {
        0%, 10% { stroke-dashoffset: 220; }
        45%, 88% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fillGreen {
        0%, 25% { fill-opacity: 0.15; }
        50%, 88% { fill-opacity: 0.72; }
        100% { fill-opacity: 0.2; }
      }
    </style>
  </defs>

  <rect width="960" height="340" rx="14" fill="url(#bgDark)" stroke="#1e293b" stroke-width="2"/>

  <!-- LEFT PANEL: Legacy Centroid Snapping -->
  <g transform="translate(20, 18)">
    <rect width="450" height="304" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="14" y="12" width="422" height="32" rx="6" fill="#450a0a" fill-opacity="0.65"/>
    <text x="26" y="33" fill="#fca5a5" font-size="13" font-weight="700" class="ui">❌ Legacy Centroid Snapping (False Penalty)</text>

    <!-- Roads -->
    <!-- Top Road (Direct to Facility, 180m) -->
    <line x1="40" y1="90" x2="390" y2="90" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>
    <text x="215" y="78" fill="#86efac" font-size="10.5" font-weight="600" class="mono">Direct Street to Facility (180 m)</text>

    <!-- Right Detour Road (340m) -->
    <path d="M 355 90 L 355 245 L 180 245" stroke="#eab308" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="364" y="175" fill="#fde047" font-size="10" class="mono">Detour (340m)</text>

    <!-- Target Facility Blue Point on Top Left -->
    <circle cx="65" cy="90" r="9.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <text x="40" y="68" fill="#93c5fd" font-size="10.5" font-weight="700" class="ui">Target Facility</text>

    <!-- Large Urban Residential Block -->
    <rect x="175" y="102" width="160" height="128" rx="4" fill="#ca8a04" fill-opacity="0.38" stroke="#facc15" stroke-width="1.8"/>
    <text x="192" y="132" fill="#fef08a" font-size="11.5" font-weight="700" class="ui">Residential Block</text>
    <text x="192" y="148" fill="#fde047" font-size="10" class="mono">Misclassified: &gt; 250 m</text>

    <!-- Block Centroid (Closer to Right Road 35m vs Top Road 64m) -->
    <circle cx="255" cy="166" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="205" y="185" fill="#fca5a5" font-size="10" class="mono">Centroid (x_c, y_c)</text>

    <!-- Wrong Snap Line to Right Detour Road -->
    <line x1="255" y1="166" x2="355" y2="166" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="355" cy="166" r="4" fill="#ef4444"/>

    <text x="24" y="274" fill="#cbd5e1" font-size="11" class="ui">• Centroid snaps to side street (340 m &gt; 250 m threshold).</text>
    <text x="24" y="292" fill="#fca5a5" font-size="11" font-weight="600" class="ui">• Result: Block next to a 250 m green street is NOT painted green!</text>
  </g>

  <!-- RIGHT PANEL: New Closest Road-Facing Facade Engine -->
  <g transform="translate(490, 18)">
    <rect width="450" height="304" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="14" y="12" width="422" height="32" rx="6" fill="#052e16" fill-opacity="0.85" stroke="#16a34a" stroke-width="1"/>
    <text x="26" y="33" fill="#4ade80" font-size="13" font-weight="700" class="ui">✅ Closest Road-Facing Facade Engine (v5.3.0)</text>

    <!-- Roads -->
    <line x1="40" y1="90" x2="390" y2="90" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M 355 90 L 355 245 L 180 245" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Animated Glowing Green Path from Blue Facility to Block North Facade -->
    <line x1="65" y1="90" x2="255" y2="90" class="green-wave"/>
    <text x="155" y="76" fill="#4ade80" font-size="11" font-weight="700" class="mono">Shortest Path: 180 m (&lt;= 250 m)</text>

    <!-- Target Facility Blue Point on Top Left -->
    <circle cx="65" cy="90" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="2.6"/>
    <circle cx="65" cy="90" r="10" fill="none" stroke="#60a5fa" stroke-width="2">
      <animate attributeName="r" values="10;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="68" fill="#93c5fd" font-size="10.5" font-weight="700" class="ui">Target Facility</text>

    <!-- Large Urban Residential Block (Painted Vibrant Green!) -->
    <rect x="175" y="102" width="160" height="128" rx="4" class="facade-pulse"/>
    <text x="192" y="148" fill="#ffffff" font-size="12" font-weight="700" class="ui">Residential Block</text>
    <text x="192" y="166" fill="#bbf7d0" font-size="10.5" font-weight="700" class="mono">0–250 m GREEN CLASS</text>
    <text x="192" y="184" fill="#86efac" font-size="10" class="mono">Walk Distance: 180.0 m</text>

    <!-- Sampled Facade Points Along Block Perimeter -->
    <circle cx="200" cy="102" r="3" fill="#86efac"/>
    <circle cx="228" cy="102" r="3" fill="#86efac"/>
    <circle cx="255" cy="102" r="5" fill="#4ade80" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="282" cy="102" r="3" fill="#86efac"/>
    <circle cx="310" cy="102" r="3" fill="#86efac"/>

    <!-- Short Facade Connector from North Facade (y=102) to Street (y=90) -->
    <line x1="255" y1="102" x2="255" y2="90" stroke="#4ade80" stroke-width="3" stroke-dasharray="3 2"/>
    <circle cx="255" cy="90" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Travelling Green Pulse from Facility to Block Facade -->
    <circle r="4.5" fill="#bbf7d0" filter="url(#neonGreen)">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M 65 90 L 255 90 L 255 102"/>
    </circle>

    <text x="24" y="274" fill="#d1fae5" font-size="11" class="ui">• Connects from the road-facing facade closest to the target facility.</text>
    <text x="24" y="292" fill="#4ade80" font-size="11" font-weight="700" class="ui">• Result: Block is accurately reached in 180 m and painted vibrant Green!</text>
  </g>
</svg>
